# Prior specification — SINGLE SOURCE OF TRUTH for the dose-response calibration.
#
# Consumed by priors.R, which (a) builds the Stan `pr_*` hyperparameter data list
# (the model reads these from its data block — change a value here and refit, NO
# recompile) and (b) provides generic prior samplers/densities for the
# prior-predictive run and the prior-vs-posterior overlay plot.
#
# Keys MUST match the Stan parameter names. Families:
#   normal       -> mu, sd                 (Stan: pr_<p>_mu, pr_<p>_sd)
#   half_normal  -> mu, sd  (lower=0)       (Stan: pr_<p>_mu, pr_<p>_sd; param declared <lower=0>)
#   lognormal    -> meanlog, sdlog          (Stan: pr_<p>_mu, pr_<p>_sd)
#   beta         -> a, b                    (Stan: pr_<p>_a,  pr_<p>_b)
#   exponential  -> rate    (lower=0)       (Stan: pr_<p>_rate; param declared <lower=0>)
#
# Values are ../joint_inference_plan.md Section 7. All flagged TO BE EXAMINED there.

# ---- Biological parameters ----
log10_N50_inf:     { family: normal,      mu: 2.5,  sd: 1.0 }   # ~300 bicarb CFU
log10_N50_fevginf: { family: normal,      mu: 2.8,  sd: 1.0 }   # ~600 bicarb CFU (via d_fev offset)
d_fev:             { family: half_normal, mu: 0.0,  sd: 1.0 }   # ordering: fever threshold >= infection
alpha_inf:         { family: lognormal,   meanlog: -1.5, sdlog: 0.8 }   # ~0.1-0.5
alpha_fevginf:     { family: lognormal,   meanlog: -1.5, sdlog: 0.8 }
# gamma priors on the EU/mL titre scale, ANCHORED to two published titre->protection
# slopes (2026-07-15) [Mike: use Jin's result to inform the prior, in lieu of digitizing
# Jin Fig S3 — see notes below / tier1_lab_notebook.md "+Jin-CoP-anchor"]:
#   - Jin 2017 adjusted logistic OR 0.37 (95% CI 0.15-0.88) per log10 anti-Vi IgG EU/mL
#     (VERIFIED: Fig S3 x-axis "Log10 anti-Vi IgG (ELISA units per mL)"; typhoid diagnosis).
#   - Darton 2016 HR 0.29 per log10 anti-Vi IgG EU/mL (same VaccZyme scale).
# Both are COMPOSITE-diagnosis slopes -> they constrain the COMBINED gamma_inf+gamma_fevginf
# effect, not each layer. Map (single-layer beta-Poisson at the control op point P~0.77):
# d logit(P)/d log10(CoP) = -gamma*ln(10)*u/(1-e^-u), u=-ln(1-P)=1.47 -> slope=-gamma*4.40.
# OR 0.37 => ln(0.37)/-4.40 = 0.23; CI 0.15-0.88 => gamma_eff ~ [0.03, 0.43]. The C3 fit
# reproduces the Jin composite with gamma_inf~0.20, gamma_fevginf~0.15, so median ~0.2 on
# EACH layer is consistent. sdlog tightened 0.9->0.7 (two concordant anchors), still weakly-
# informative: median 0.20, 95% ~[0.05, 0.8] ~ the OR-implied range. Data (Darton individual
# cascade + Jin groups) still moves it.
gamma_inf:         { family: lognormal,   meanlog: -1.6, sdlog: 0.7 }   # median ~0.2 (Jin/Darton)
gamma_fevginf:     { family: lognormal,   meanlog: -1.6, sdlog: 0.7 }   # median ~0.2 (Jin/Darton)

# ---- Nuisance parameters ----
log10_delta:       { family: normal,      mu: 3.5,  sd: 0.7 }   # ~1000-30000x
# pi_susc PROVENANCE [documented 2026-07-31]: the 36/53 = 0.68 that motivates Beta(7,4)
# is the prevalence of UNDETECTABLE H (flagellar) AGGLUTININ in Gilman's controls
# (Gilman 1977 Table 5: 36 at <1:20, 17 at >=1:20). It is an H-antibody prevalence being
# used as the mixing weight of a mixture whose components are indexed on the anti-Vi CoP
# scale. Gilman p.721 and Levine 1976 p.427 both report that O and Vi antibody did NOT
# correlate with protection in this population, while H did -- so the axis the weight
# comes from is not the axis the components live on. ../joint_inference_plan.md:211 notes
# this ("H-antibody, NOT Vi"); recorded here so the prior's justification carries it too.
# CONCORDANCE, NOT A SUBSTITUTE [Mike 2026-07-31]: Woodward 1980 Table C p.555 reports
# 200 non-veterans / 105 TAB-vaccinated veterans at 10^5 = 0.66 non-immune, close to
# Gilman's 0.68. That is reassuring but the two are DIFFERENT STRATIFICATIONS -- H
# agglutinin status vs military/prior-vaccination status -- and Woodward's denominator
# does not go with the numerator this model fits (the attack-rate counts come from
# Gilman's H strata). So the agreement is corroboration of the rough magnitude only;
# it is NOT an interchangeable anchor and the prior is not re-derived from Woodward.
# Woodward is also unusable as a likelihood row for three independent reasons: it is a
# REVIEW of the same 16-year program (its ~305 controls at 10^5 overlap the 277 already
# in the fit -- Hornick 116, Levine 97, Gilman 64 -- so it would double-count), it
# publishes percentages only, and it never defines its clinical endpoint (so T, and
# hence phi(T,D), is undetermined).
# CONSEQUENCE: pi_susc's posterior agreeing with Gilman's 36/53 is near-circular and is
# not evidence the mixture weight is identified by the challenge data.
pi_susc:           { family: beta,        a: 7,     b: 4 }       # ~0.65 (Gilman 36/53, H-agglutinin)
# CoP units are DEFINITIONAL: anti-Vi IgG (VaccZyme EU/mL) relative to naive (=1).
# These latent Maryland CoPs are anti-Vi-EQUIVALENT (anti-Vi not measured pre-VaccZyme).
# CoP_imm [Mike 2026-07-15]: max-entropy Exponential with mean 50 EU/mL ABSOLUTE =
# 50/3.7 = 13.5 on the CoP (anti-Vi/naive) scale -> rate = 3.7/50 = 0.074. Asserts
# only the mean (natural-infection-immune subpop, ~Vi-PS-vaccine level); UNIDENTIFIED
# (no pre-VaccZyme serology) so prior ~= posterior. Mode at 0 (max-ent) allows the
# immune-component CoP to dip toward naive; label kept distinct by CoP_susc's tight
# prior at ~1 and pi_susc (Beta(7,4)). Enters as CoP^gamma (compressive).
CoP_imm:           { family: exponential, rate: 0.074 }               # mean 13.5 (=50 EU/mL abs)
CoP_susc:          { family: lognormal,   meanlog: 0.0,  sdlog: 0.3 }   # ~1x naive

# Maryland fever definition-sensitivity, now DOSE-DEPENDENT phi(T,D) (C3, 2026-07-15).
#   phi(T,D) = phi0(T) + (1 - phi0(T)) * P_fev_naive(D_eff)^beta_phi
#   phi0(T)  = inv_logit(phi0_a - phi0_b*(T - T_ref)),  T_ref = 38.0
# Retires the free scalar phi_md (was Beta(1,1), edge-pressing at ~0.97). phi0(T) is
# pinned by the Darton placebo ladder (>=38/38.5/39 among 20 TD+ = 16/10/8); beta_phi
# (the dose-lift toward 1 at saturation) rests on Hornick's multi-dose fever (THIN ID).
# phi0_a: logit phi0 at T_ref=38. Darton >=38 is 16/20=0.80 -> logit ~1.4; weakly informative.
# phi0_b: logit decay per degC, >=0 (monotone-decreasing). Darton implies ~1.8/degC.
# NB: the dose-lift exponent beta_phi is PINNED to 1 in the model (2026-07-15) -- the C3
# fit showed it prior-dominated, so it is no longer a free parameter (no prior here).
phi0_a:            { family: normal,      mu: 1.0,  sd: 1.5 }
phi0_b:            { family: half_normal, mu: 0.0,  sd: 2.0 }

# ---- eta-correction parameters (Tier 2) ----
eta_lo:            { family: beta,        a: 5,     b: 5 }       # ~0.5
kappa:             { family: lognormal,   meanlog: 0.0,  sdlog: 1.0 }

# ---- Study-level overdispersion (INERT in Tier 1) ----
sigma_study:       { family: half_normal, mu: 0.0,  sd: 0.5 }
